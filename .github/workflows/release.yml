name: Release

# Publishing a GitHub Release is the trigger. Everything that was done by hand
# for v0.1.0 — build, test, deploy, verify the live origin — happens here, in
# that order, and the deploy is gated on the tests rather than sequenced after
# them by hope.
#
# `workflow_dispatch` exists for the case the deploy step fails after a release
# is already published: pick the tag and re-run, rather than cutting a fake
# release or reaching for a laptop.
on:
  release:
    types: [published]
  workflow_dispatch:

# Never two deploys at once, and never cancel one in flight: a half-finished
# `pages deploy` is worse than a queued one.
concurrency:
  group: release-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: localmd
  PRODUCTION_URL: https://localmd-12t.pages.dev/

jobs:
  gate:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag pointing at a tree that says it is a different version is the
      # cheapest release mistake to make and the most confusing to find later.
      - name: Tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $tag does not match package.json ($pkg)"
            exit 1
          fi
          echo "$tag matches package.json"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Includes assert:no-external — fails if any third-party URL reaches dist/.
      - run: npm run build
      - name: Enforce bundle size budget
        run: node scripts/assert-bundle-budget.mjs

      # The deploy job ships these exact bytes rather than building its own, so
      # what reaches production is what this job checked.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Tier 1/2 matrix as CI. A privacy or CSP regression in one engine
        # blocks the deploy, which is the whole point of running them here too.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy and verify production
    needs: [gate, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      # Literal: the `env` context is not available to job-level keys.
      url: https://localmd-12t.pages.dev/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Fail with a sentence somebody can act on, rather than a wrangler auth
      # error four steps later.
      - name: Cloudflare credentials are present
        env:
          # Through the environment, never interpolated into the script: a
          # secret pasted into a shell line is a secret one metacharacter away
          # from being executed.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch main

      - run: npx playwright install --with-deps chromium

      # The one check that runs against the real origin, so it is the only one
      # that can see the response headers as actually served. Everything before
      # this ran against `vite preview`, which does not apply `dist/_headers`.
      - name: Verify production
        run: node scripts/verify-production.mjs "$PRODUCTION_URL"
