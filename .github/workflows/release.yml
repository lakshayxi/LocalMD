name: Release

# Publishing a GitHub Release runs the quality gate (typecheck, lint, test,
# build, bundle budget) and the full E2E matrix against that release. It does
# not deploy: Cloudflare Pages builds and deploys the browser app on its own,
# through its Git integration, on every push to main, independent of this
# workflow. This workflow exists to leave a release-time quality record, not
# to control what reaches production.
#
# `workflow_dispatch` re-runs these checks against a chosen ref without
# cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A tag pointing at a tree that says it is a different version is the
      # cheapest release mistake to make and the most confusing to find later.
      - name: Tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$TAG"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $tag does not match package.json ($pkg)"
            exit 1
          fi
          echo "$tag matches package.json"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Includes assert:no-external — fails if any third-party URL reaches dist/.
      - run: npm run build
      - name: Enforce bundle size budget
        run: node scripts/assert-bundle-budget.mjs

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same Tier 1/2 matrix as CI.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
